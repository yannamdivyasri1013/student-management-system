{% extends 'base.html' %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="login-page d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-card card shadow-lg border-0">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="brand-icon mb-3">S</div>
                <h2 class="fw-bold text-primary">Student Management System</h2>
                <p class="text-muted">Admin Login</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
                <p class="text-center mt-3 mb-0">
                    New admin?
                    <a href="{% url 'register' %}" class="text-primary text-decoration-none">Register here</a>
                </p>
            </form>
        </div>
    </div>
</div>
{% endblock %}

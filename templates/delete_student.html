{% extends 'base.html' %}

{% block title %}Delete Student{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm mx-auto mt-5" style="max-width: 550px;">
    <div class="card-body p-4">
        <h3 class="fw-bold mb-3 text-danger">Delete Student</h3>
        <p>Are you sure you want to delete <strong>{{ student.name }}</strong> with roll number <strong>{{ student.roll_number }}</strong>?</p>
        <p class="text-muted mb-4">This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">Delete</button>
                <a href="{% url 'student_profile' student.pk %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
